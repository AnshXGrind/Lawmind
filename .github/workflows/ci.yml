name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # Backend — Python 3.11, FastAPI, pytest
  # ──────────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          pip install flake8
          flake8 app/ --max-line-length=100 --ignore=E501,W503 --exclude=__pycache__ || true

      - name: Run tests
        env:
          # Use a dummy key so imports that call configure() don't error
          GEMINI_API_KEY: "dummy-ci-key"
          SECRET_KEY: "ci-secret-key"
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          pip install pytest pytest-asyncio httpx
          if [ -d tests ]; then pytest tests/ -v --tb=short; else echo "No tests directory found — skipping"; fi

  # ──────────────────────────────────────────────────────────
  # Frontend — Node 18, React build
  # ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src/ --ext .js,.jsx --max-warnings 50 || true

      - name: Build
        env:
          CI: false          # Treat warnings as warnings, not errors
          REACT_APP_API_URL: "http://localhost:8000"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7
