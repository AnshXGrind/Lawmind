name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install huggingface-hub
        run: pip install huggingface-hub

      - name: Push hf_space/ to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME || 'lawmind-legal-ai' }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi, create_repo

          token    = os.environ["HF_TOKEN"]
          username = os.environ["HF_USERNAME"]
          space    = os.environ["HF_SPACE_NAME"]
          repo_id  = f"{username}/{space}"

          api = HfApi(token=token)

          # Create space if it doesn't exist
          create_repo(repo_id, repo_type="space", space_sdk="docker", token=token, exist_ok=True)
          print(f"✅ Space ready: https://huggingface.co/spaces/{repo_id}")

          # Upload the entire hf_space/ directory as the Space root
          api.upload_folder(
              folder_path="hf_space",
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"Auto-deploy from GitHub Actions",
              ignore_patterns=["__pycache__", "*.pyc", ".env", "*.db", "uploads/", "exports/"],
          )
          print(f"✅ Deployed! https://huggingface.co/spaces/{repo_id}")
          print(f"🌐 API: https://{username}-{space}.hf.space")
          EOF

      - name: Summary
        run: |
          echo "🎉 Space: https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME || 'lawmind-legal-ai' }}"
          echo "🌐 API:   https://${{ secrets.HF_USERNAME }}-${{ secrets.HF_SPACE_NAME || 'lawmind-legal-ai' }}.hf.space"
          echo "📖 Docs: https://${{ secrets.HF_USERNAME }}-${{ secrets.HF_SPACE_NAME || 'lawmind-legal-ai' }}.hf.space/docs"

